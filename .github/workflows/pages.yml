# Build dino.nes (and the page data) from source and publish it with docs/ to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # NES_TRACE=1: also record which F# line put each byte; Site.fsx turns that into docs/data.js.
      # --tailcalls- keeps every caller on the stack (a snippet's last call would drop its frame).
      - run: NES_TRACE=1 dotnet fsi --tailcalls- Dino.fsx
      - run: dotnet fsi Site.fsx
      - run: |
          mkdir site
          cp -r docs/. site/
          cp output/dino.nes site/
          sha1sum site/dino.nes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
